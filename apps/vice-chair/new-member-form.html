<body>
  <header class="topbar"><a class="back" href="case-board.html">← 回進行中案件</a><div><strong>富聯分會</strong><span>會員委員會工作台</span></div><label>目前登入身份<select id="loginUser"></select></label></header>
  <main>
    <section class="hero applicant-hero"><div><span class="eyebrow">中心區公版 V1.1（20261012）・新會員用途</span><h1>新會員入會訪談</h1><p>填寫會員成功訪談表 A～F 區，以及會員制度與權益確認書。</p></div><div class="save-state"><i></i><span id="saveState">草稿已儲存</span><small id="saveTime">尚未編輯</small></div></section>
    <div class="layout">
      <aside class="steps" data-guide-id="form.progress-panel"><b>填寫進度</b><div class="progress"><i id="progressBar"></i></div><strong id="progressText">0%</strong><nav><a href="#basic">基本資料</a><a href="#professional">A 專業與事業基礎</a><a href="#goals">B 動機與企圖</a><a href="#cooperation">C 合作與市場</a><a href="#commitment">D 文化與參與</a><a href="#expectations">E 期望值管理</a><a href="#contacts">F 商務名單</a><a href="#training">制度與權益確認書</a><a href="#closing">委員內部紀錄</a></nav><div class="privacy"><b>正式輸出邊界</b><p>官方題目與填寫內容會輸出；委員內部紀錄不輸出。</p></div></aside>
      <form id="newMemberForm" hidden>
        <section class="form-card" id="basic"><div class="section-head"><span>01</span><div><h2>基本資料</h2><p>案件須已完成電子簽單與繳費</p></div></div><div class="case-gate"><span>流程前置</span><b>已簽單・已繳費</b><small>富聯完成付款後才安排會員委員訪談</small></div><div class="fields two"><label>會談日期與時間<input id="meetingDate" type="datetime-local" data-save></label><label>訪談方式／地址<input id="meetingPlace" value="ZOOM 線上訪談" data-save></label><label>申請者姓名<input id="applicantSearch" list="applicantList" data-save><datalist id="applicantList"></datalist></label><label>申請專業類別<input id="profession" placeholder="請依申請書手動填寫" data-save></label><label>引薦人<select id="referrerName" data-save required><option value="">載入既有會員中…</option></select><small>請選擇正式會員；供通過後的公告文案使用，不輸出至訪談 Word。</small></label><label>主訪委員<input id="leadInterviewer" readonly></label><label>陪訪委員<input id="companionInterviewer" list="committeeList" data-save></label><label>第二陪訪（選填）<input id="secondCompanion" list="committeeList" data-save></label><label>公司名稱<input id="companyName" data-save></label><label>分會<input value="富聯" readonly></label><datalist id="committeeList"></datalist></div></section>

        <div id="membershipSections"></div>

        <section class="actions"><div><b>新會員訪談</b><p>正式完成後會保存 Word，並把案件推進至待發送委員回饋。</p></div><button type="button" class="ghost" id="resetDraft">清除未完成草稿</button><button type="button" class="primary" id="downloadWord">完成訪談並產生 Word</button></section>
      </form>
    </div>
  </main>
